name: QA
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
      - name: Install private Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ secrets.SYMSVEL_READ_TOKEN }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::SYMSVEL_READ_TOKEN is missing. A read-only token for private SymSvel repositories is required."
            exit 1
          fi
          for repository in symsvel-module-mails symsvel-module-settings; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repository"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read private repository $repository (check expiry and permissions)."
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - run: composer qa

  database-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            image: postgres:17
            url: postgresql://symsvel_auth:symsvel_auth@127.0.0.1:5432/symsvel_auth
          - engine: mysql
            image: mysql:8.4
            url: mysql://symsvel_auth:symsvel_auth@127.0.0.1:3306/symsvel_auth
          - engine: mariadb
            image: mariadb:11.4
            url: mysql://symsvel_auth:symsvel_auth@127.0.0.1:3306/symsvel_auth
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: symsvel_auth
          POSTGRES_PASSWORD: symsvel_auth
          POSTGRES_DB: symsvel_auth
          MYSQL_USER: symsvel_auth
          MYSQL_PASSWORD: symsvel_auth
          MYSQL_DATABASE: symsvel_auth
          MYSQL_ROOT_PASSWORD: symsvel_auth_root
          MARIADB_USER: symsvel_auth
          MARIADB_PASSWORD: symsvel_auth
          MARIADB_DATABASE: symsvel_auth
          MARIADB_ROOT_PASSWORD: symsvel_auth_root
        ports:
          - 5432:5432
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_mysql, pdo_sqlite
      - name: Install private Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ secrets.SYMSVEL_READ_TOKEN }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::SYMSVEL_READ_TOKEN is missing. A read-only token for private SymSvel repositories is required."
            exit 1
          fi
          for repository in symsvel-module-mails symsvel-module-settings; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repository"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read private repository $repository (check expiry and permissions)."
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Wait for database
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: |
          php -r '
          require "vendor/autoload.php";
          $lastError = null;
          for ($i = 0; $i < 20; ++$i) {
              try {
                  \Doctrine\DBAL\DriverManager::getConnection((new \Doctrine\DBAL\Tools\DsnParser(["postgresql" => "pdo_pgsql", "mysql" => "pdo_mysql", "mariadb" => "pdo_mysql"]))->parse(getenv("DATABASE_URL")))->executeQuery("SELECT 1")->fetchOne();
                  exit(0);
              } catch (\Throwable $e) {
                  $lastError = $e;
                  sleep(1);
              }
          }
          fwrite(STDERR, "Database did not become ready: ".($lastError?->getMessage() ?? "unknown error")."\n");
          exit(1);
          '
      - name: DBAL integration and lock contention
        env:
          SYMSVEL_AUTH_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit -c back/phpunit.xml.dist back/tests/Token/DbalTokenStoreMatrixTest.php back/tests/Token/RefreshLockContentionTest.php back/tests/Token/PasswordResetMatrixTest.php back/tests/Token/PasswordResetLockContentionTest.php back/tests/Token/PasswordResetLimiterContentionTest.php

  bo-integration:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - name: Checkout Auth module
        uses: actions/checkout@v4
      - name: Checkout BO host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-bo
          ref: dev
          path: assembled-bo
          token: ${{ secrets.SYMSVEL_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-bo/package-lock.json
      - name: Assemble Auth module like Tooling
        run: |
          mkdir -p assembled-bo/src/lib/modules/auth/routes/auth/activate
          mkdir -p assembled-bo/src/routes/auth/activate
          cp bo/src/lib/modules/auth/*.ts assembled-bo/src/lib/modules/auth/
          cp bo/src/routes/auth/activate/+page.svelte assembled-bo/src/lib/modules/auth/routes/auth/activate/+page.svelte
          cat > assembled-bo/src/routes/auth/activate/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/auth/routes/auth/activate/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
      - name: Install BO dependencies
        working-directory: assembled-bo
        run: npm ci --no-audit --no-fund
      - name: Format assembled BO
        working-directory: assembled-bo
        run: npm run format
      - name: Verify BO types, style, static build and unit tests
        working-directory: assembled-bo
        run: |
          npm run check
          npm run lint
          npm run build
          npx playwright install chromium
          npm run test:unit -- --run
