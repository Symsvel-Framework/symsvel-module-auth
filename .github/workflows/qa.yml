name: QA
on: [push, pull_request]

# GitHub-hosted matrix jobs use isolated ephemeral DB services for each engine.
concurrency:
  group: symsvel-auth-database-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4 and SQLite driver
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500 || !extension_loaded("pdo_sqlite")) { exit(1); }'
      - name: Install private Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::SYMSVEL_READ_TOKEN is missing. A read-only token for private SymSvel repositories is required."
            exit 1
          fi
          for repository in symsvel-module-mails symsvel-module-settings symsvel-module-acls; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repository"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read private repository $repository (check expiry and permissions)."
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - run: composer qa

  database-matrix:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: symsvel_ci
          POSTGRES_PASSWORD: symsvel_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symsvel_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: symsvel_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psymsvel_ci_only"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: symsvel_ci_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4 and database drivers
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          php -v
          php -r '$needed = match (getenv("ENGINE")) { "postgres" => "pdo_pgsql", "mysql", "mariadb" => "pdo_mysql", default => throw new RuntimeException("Unknown engine") }; $missing = array_values(array_filter(["pdo_sqlite", $needed], static fn (string $driver): bool => !extension_loaded($driver))); if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500 || $missing !== []) { fwrite(STDERR, "Unsupported PHP or missing drivers for ".getenv("ENGINE").": ".implode(", ", $missing)."\\n"); exit(1); }'
      - name: Install private Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then
            echo "::error::SYMSVEL_READ_TOKEN is missing. A read-only token for private SymSvel repositories is required."
            exit 1
          fi
          for repository in symsvel-module-mails symsvel-module-settings symsvel-module-acls; do
            if ! curl --fail --silent --show-error --output /dev/null \
                --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Symsvel-Framework/$repository"; then
              echo "::error::SYMSVEL_READ_TOKEN cannot read private repository $repository (check expiry and permissions)."
              exit 1
            fi
          done
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Install PostgreSQL and MySQL clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client default-mysql-client
      - name: Reset dedicated Auth database and execute DBAL matrix
        env:
          ENGINE: ${{ matrix.engine }}
          SYMSVEL_CI_POSTGRES_PASSWORD: symsvel_ci_only
        run: |
          if [ -z "$SYMSVEL_CI_POSTGRES_PASSWORD" ]; then
            echo "::error::SYMSVEL_CI_POSTGRES_PASSWORD is required for local database CI."
            exit 1
          fi
          case "$ENGINE" in
            postgres)
              export PGPASSWORD="$SYMSVEL_CI_POSTGRES_PASSWORD"
              pg_isready -h 127.0.0.1 -U symsvel_ci -d postgres
              dropdb --if-exists --force -h 127.0.0.1 -U symsvel_ci symsvel_auth_ci
              createdb -h 127.0.0.1 -U symsvel_ci symsvel_auth_ci
              export SYMSVEL_AUTH_TEST_DATABASE_URL="$(php -r 'echo "postgresql://symsvel_ci:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@127.0.0.1:5432/symsvel_auth_ci";')"
              ;;
            mysql|mariadb)
              export PORT=3306
              if [ "$ENGINE" = mariadb ]; then PORT=3307; fi
              mysql --host=127.0.0.1 --port="$PORT" --protocol=tcp --user=root --password="$SYMSVEL_CI_POSTGRES_PASSWORD" --execute='DROP DATABASE IF EXISTS symsvel_auth_ci; CREATE DATABASE symsvel_auth_ci'
              export SYMSVEL_AUTH_TEST_DATABASE_URL="$(php -r 'echo "mysql://root:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@"127.0.0.1:".getenv("PORT")/symsvel_auth_ci";')"
              ;;
            *)
              echo "::error::Unexpected database engine."
              exit 1
              ;;
          esac
          vendor/bin/phpunit -c back/phpunit.xml.dist back/tests/Token/DbalTokenStoreMatrixTest.php back/tests/Token/RefreshLockContentionTest.php back/tests/Token/PasswordResetMatrixTest.php back/tests/Token/PasswordResetLockContentionTest.php back/tests/Token/PasswordResetLimiterContentionTest.php

  bo-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Auth module
        uses: actions/checkout@v4
      - name: Checkout BO host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-bo
          ref: dev
          path: assembled-bo
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-bo/package-lock.json
      - name: Assemble Auth module like Tooling
        run: |
          mkdir -p assembled-bo/src/lib/modules/auth/routes/auth/activate
          mkdir -p assembled-bo/src/routes/auth/activate
          cp bo/src/lib/modules/auth/*.ts assembled-bo/src/lib/modules/auth/
          cp bo/src/routes/auth/activate/+page.svelte assembled-bo/src/lib/modules/auth/routes/auth/activate/+page.svelte
          cat > assembled-bo/src/routes/auth/activate/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/auth/routes/auth/activate/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
      - name: Install BO dependencies
        working-directory: assembled-bo
        run: npm ci --no-audit --no-fund
      - name: Format assembled BO
        working-directory: assembled-bo
        run: npm run format
      - name: Verify BO types, style, static build and unit tests
        working-directory: assembled-bo
        run: |
          npm run check
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:unit -- --run
